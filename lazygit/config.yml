# Kanagawa Wave (colors from rebelot/kanagawa.nvim)
gui:
  theme:
    activeBorderColor:
      - "#7e9cd8"
      - bold
    inactiveBorderColor:
      - "#54546d"
    searchingActiveBorderColor:
      - "#e6c384"
      - bold
    optionsTextColor:
      - "#7fb4ca"
    selectedLineBgColor:
      - "#223249"
    inactiveViewSelectedLineBgColor:
      - "#2a2a37"
      - bold
    cherryPickedCommitFgColor:
      - "#1f1f28"
    cherryPickedCommitBgColor:
      - "#7aa89f"
    markedBaseCommitFgColor:
      - "#1f1f28"
    markedBaseCommitBgColor:
      - "#e6c384"
    unstagedChangesColor:
      - "#e46876"
    defaultFgColor:
      - "#dcd7ba"

